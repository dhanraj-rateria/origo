[project]
name = "origo-edge"
version = "0.1.0"
description = "Origo Edge API server for Groundlink platform"
requires-python = "^3.11"
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.23.0",
  "pydantic>=2.7.0",
  "httpx>=0.28.0"
]

[tool.flake8]
max-line-length = 120
exclude = ["__pycache__", "build", "dist"]
