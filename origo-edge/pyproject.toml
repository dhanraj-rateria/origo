[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "origo-edge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "arq>=0.26",                       # redis-backed async task queue
  "redis>=5.0",
  "structlog>=24.4",
  "python-jose[cryptography]>=3.3",  # OIDC token verification
  "sgp4>=2.23",                      # orbit propagation
  "skyfield>=1.49",                  # AOS/LOS geometry
  "prometheus-client>=0.20",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0",
  "httpx>=0.27", "testcontainers[postgres]>=4.8",
  "mypy>=1.11", "ruff>=0.6", "polyfactory>=2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/origo_edge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"