[build-system]
requires = ["hatchling", "grpcio-tools>=1.66",]
build-backend = "hatchling.build"

[project]
name = "origo-info-adapter"
version = "0.1.0"
description = "Ground-network adapter port and StellarStation implementation for Origo"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.66",
  "protobuf>=5.27",
  "google-auth>=2.34",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.66",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-protobuf",
]

[tool.hatch.build.targets.wheel]
packages = ["src/origo_info_adapter"]
