[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "origo-stellarstation-mock"
version = "0.1.0"
description = "Protocol-accurate StellarStation emulator for the Docker device loop — implements the real stellarstation.proto OpenSatelliteStream RPC, relaying to a registered Origo Space container, rather than a custom REST shape. Booking/discovery RPCs are unimplemented stubs — see server.py's module docstring for why that's scoped deliberately, not an oversight."
requires-python = ">=3.12"
dependencies = [
  "origo-info-adapter",
  "grpcio>=1.66",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "structlog>=24.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/origo_stellarstation_mock"]
