[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "origo-station-agent"
version = "0.1.0"
description = "Ground Edge Agent (design §3.3): runs the live pass-time protocol against the Ground HSM and the ground-network adapter; syncs with origo-edge between passes."
requires-python = ">=3.12"
dependencies = [
  "origo-info-adapter",
  "grpcio>=1.66",
  "httpx[http2]>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.66", "pytest>=8.3", "pytest-asyncio>=0.24",
  "mypy>=1.11", "ruff>=0.6", "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/origo_station_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/origo_station_agent/_proto" = "origo_station_agent/_proto"